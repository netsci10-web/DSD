<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>천체 관측 대시보드</title>
    <!-- 외부 라이브러리: Tailwind CSS, SunCalc, Leaflet, Lucide Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/suncalc/1.9.0/suncalc.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* 스크롤바 숨김 처리 */
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* 달력 배경용 밤하늘 그라데이션 */
        .night-sky {
            background: linear-gradient(to bottom, #071120 0%, #152845 50%, #1b3760 100%);
        }
    </style>
</head>
<body class="bg-gray-950 text-white min-h-screen flex flex-col">
    <!-- 메인 앱 컨텐츠 렌더링 영역 -->
    <div id="app" class="flex-grow pb-48 relative transition-all duration-300"></div>

    <!-- 고정 네비게이션 및 날짜 선택기 (하단) -->
    <div id="controls" class="fixed bottom-0 w-full bg-gray-900 border-t border-gray-800 z-50">
        
        <!-- 상하 스크롤 휠 피커 및 좌우 도구 -->
        <div id="date-picker-section" class="flex justify-between items-center border-b border-gray-800 h-[120px] transition-all duration-300 px-3 sm:px-6">
            
            <!-- 왼쪽 도구 (오늘로 가기) -->
            <div class="flex items-center justify-center shrink-0 z-10 w-14">
                <button onclick="goToToday()" class="bg-gray-800 hover:bg-gray-700 text-white rounded-2xl flex items-center justify-center w-12 h-12 sm:w-14 sm:h-14 transition-colors shadow-lg border border-gray-700" title="오늘로 가기">
                    <i data-lucide="calendar-check" class="w-6 h-6 sm:w-7 sm:h-7 text-blue-400"></i>
                </button>
            </div>
            
            <!-- 가운데 3열 휠 피커 -->
            <div id="wheel-picker-container" class="flex-grow relative overflow-hidden h-[108px] flex justify-center items-center max-w-[280px] mx-auto">
                <div class="absolute top-1/2 -translate-y-1/2 w-full h-[36px] bg-blue-600/20 border-y border-blue-500/40 rounded-lg pointer-events-none"></div>
                
                <div class="flex w-full justify-center gap-1 sm:gap-3 h-full px-1">
                    <div class="relative h-full overflow-y-auto snap-y snap-mandatory scrollbar-hide flex-1 flex flex-col items-center" id="wheel-year" onscroll="handleWheelScroll()"></div>
                    <div class="relative h-full overflow-y-auto snap-y snap-mandatory scrollbar-hide flex-1 flex flex-col items-center" id="wheel-month" onscroll="handleWheelScroll()"></div>
                    <div class="relative h-full overflow-y-auto snap-y snap-mandatory scrollbar-hide flex-1 flex flex-col items-center" id="wheel-day" onscroll="handleWheelScroll()"></div>
                </div>
            </div>

            <!-- 오른쪽 도구 (달력 선택) -->
            <div class="flex items-center justify-center shrink-0 z-10 w-14">
                <div class="relative w-12 h-12 sm:w-14 sm:h-14 bg-gray-800 hover:bg-gray-700 rounded-2xl transition-colors shadow-lg border border-gray-700" title="달력 선택">
                    <input type="date" id="native-date" onchange="setDateFromPicker(event)" class="absolute inset-0 opacity-0 cursor-pointer w-full h-full">
                    <div class="text-white flex items-center justify-center h-full w-full pointer-events-none">
                        <i data-lucide="calendar-days" class="w-6 h-6 sm:w-7 sm:h-7 text-gray-300"></i>
                    </div>
                </div>
            </div>
            
        </div>

        <!-- 하단 탭 -->
        <nav class="flex justify-around p-3 bg-gray-950 text-gray-400 relative z-20">
            <button onclick="setView('home')" class="flex flex-col items-center hover:text-white transition-colors w-1/3" id="nav-home">
                <i data-lucide="telescope" class="w-6 h-6 mb-1"></i><span class="text-[10px]">홈</span>
            </button>
            <button onclick="setView('moon')" class="flex flex-col items-center hover:text-white transition-colors w-1/3" id="nav-moon">
                <i data-lucide="moon" class="w-6 h-6 mb-1"></i><span class="text-[10px]">달</span>
            </button>
            <button onclick="setView('map')" class="flex flex-col items-center hover:text-white transition-colors w-1/3" id="nav-map">
                <i data-lucide="map-pin" class="w-6 h-6 mb-1"></i><span class="text-[10px]">위치</span>
            </button>
        </nav>
    </div>

    <script>
        // --- 전역 상태 관리 ---
        let state = {
            view: 'home',
            date: new Date(), 
            location: JSON.parse(localStorage.getItem('dsd_loc')) || { lat: 35.22, lng: 128.68, name: "창원시" },
            savedLocations: JSON.parse(localStorage.getItem('saved_locs')) || [],
            data: null,
            showMoonModal: false,
            modalDate: null,
            moonViewDate: new Date()
        };

        let map = null;
        let marker = null;
        let currentMaxDays = 31;
        let isSyncing = false;
        let wheelTimeout;

        // --- 실시간 시계 업데이트 ---
        function updateClocks() {
            const now = new Date();
            const dateEl = document.getElementById('clock-date');
            const lstEl = document.getElementById('clock-lst');
            const utcEl = document.getElementById('clock-utc');
            if (dateEl && lstEl && utcEl) {
                dateEl.textContent = `${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')}`;
                lstEl.textContent = `LST ${now.toLocaleTimeString('ko-KR', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' })}`;
                utcEl.textContent = `UTC ${String(now.getUTCHours()).padStart(2, '0')}:${String(now.getUTCMinutes()).padStart(2, '0')}:${String(now.getUTCSeconds()).padStart(2, '0')}`;
            }
        }
        setInterval(updateClocks, 1000);

        function getMoonZodiac(date) {
            const jd = (date.getTime() / 86400000) + 2440587.5;
            const d = jd - 2451545.0; 
            let L = (218.316 + 13.176396 * d) % 360;
            if (L < 0) L += 360;
            let M = (134.963 + 13.064993 * d) % 360;
            if (M < 0) M += 360;
            let lambda = (L + 6.289 * Math.sin(M * Math.PI / 180)) % 360;
            if (lambda < 0) lambda += 360;

            const zodiacs = ["양자리 (Aries)", "황소자리 (Taurus)", "쌍둥이자리 (Gemini)", "게자리 (Cancer)", "사자자리 (Leo)", "처녀자리 (Virgo)", "천칭자리 (Libra)", "전갈자리 (Scorpio)", "궁수자리 (Sagittarius)", "염소자리 (Capricorn)", "물병자리 (Aquarius)", "물고기자리 (Pisces)"];
            return zodiacs[Math.floor(lambda / 30)];
        }

        function renderRealisticMoon(phase, size = 40) {
            let rx = Math.max(0.001, 0.5 * Math.abs(Math.cos(phase * 2 * Math.PI)));
            let path = "";
            if (phase <= 0.5) {
                let sweep = phase <= 0.25 ? 0 : 1;
                path = `M 0.5,0 A 0.5,0.5 0 0,1 0.5,1 A ${rx},0.5 0 0,${sweep} 0.5,0 Z`;
            } else {
                let sweep = phase <= 0.75 ? 0 : 1;
                path = `M 0.5,0 A 0.5,0.5 0 0,0 0.5,1 A ${rx},0.5 0 0,${sweep} 0.5,0 Z`;
            }
            
            const imgUrl = "https://upload.wikimedia.org/wikipedia/commons/e/e1/FullMoon2010.jpg";
            const uid = Math.random().toString(36).substring(2, 9);
            const clipId = `moonClip-${uid}`;
            
            return `
                <div style="position: relative; width: ${size}px; height: ${size}px; border-radius: 50%; background: #000; box-shadow: 0 0 8px rgba(255,255,255,0.15); display: inline-flex; overflow: hidden; flex-shrink: 0;">
                    <svg width="0" height="0" style="position: absolute; width: 0; height: 0;">
                        <defs><clipPath id="${clipId}" clipPathUnits="objectBoundingBox"><path d="${path}" /></clipPath></defs>
                    </svg>
                    <img src="${imgUrl}" alt="moon" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.2; filter: grayscale(100%);" crossorigin="anonymous">
                    <div style="position: absolute; inset: 0; clip-path: url(#${clipId}); -webkit-clip-path: url(#${clipId});">
                        <img src="${imgUrl}" alt="moon" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: grayscale(100%);" crossorigin="anonymous">
                    </div>
                    <div style="position: absolute; inset: 0; border-radius: 50%; border: 1px solid rgba(255,255,255,0.15);"></div>
                </div>
            `;
        }

        function getMoonPhaseInfo(phase, size = 40) {
            let name = "";
            if (phase < 0.03 || phase > 0.97) name = "신월 (삭)";
            else if (phase < 0.22) name = "초승달";
            else if (phase < 0.28) name = "상현달";
            else if (phase < 0.47) name = "상현 이후";
            else if (phase < 0.53) name = "보름달 (망)";
            else if (phase < 0.72) name = "하현 이전";
            else if (phase < 0.78) name = "하현달";
            else name = "그믐달";
            return { svg: renderRealisticMoon(phase, size), name: name };
        }

        function formatTime(t) {
            if (!t || isNaN(t.getTime())) return '--:--';
            return t.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', hour12: false });
        }

        function formatDateBox(t) {
            if (!t || isNaN(t.getTime())) return '';
            const dayOfWeek = ['일', '월', '화', '수', '목', '금', '토'][t.getDay()];
            return `<span class="bg-gray-800 border border-gray-700 text-gray-300 px-1.5 py-0.5 rounded text-[10px] sm:text-xs mr-1.5 flex-shrink-0 shadow-sm">${t.getMonth() + 1}/${t.getDate()}(${dayOfWeek})</span>`;
        }

        function getValidMoonEvent(eventToday, eventNext, dusk, dawn) {
            if (eventToday && eventToday >= dusk && eventToday <= dawn) return eventToday;
            if (eventNext && eventNext >= dusk && eventNext <= dawn) return eventNext;
            return null;
        }

        // --- 천체 데이터 계산 ---
        function calculateData(updatePicker = true) {
            const baseDate = new Date(state.date);
            baseDate.setHours(12, 0, 0, 0); 
            const nextDay = new Date(baseDate.getTime() + 86400000);

            const sunTimes = SunCalc.getTimes(baseDate, state.location.lat, state.location.lng);
            const sunTimesNext = SunCalc.getTimes(nextDay, state.location.lat, state.location.lng);
            const moonTimesToday = SunCalc.getMoonTimes(baseDate, state.location.lat, state.location.lng);
            const moonTimesNext = SunCalc.getMoonTimes(nextDay, state.location.lat, state.location.lng);
            const moon = SunCalc.getMoonIllumination(baseDate);

            const astroDusk = sunTimes.night;
            const astroDawn = sunTimesNext.nightEnd;

            let dsdStart = astroDusk;
            let dsdEnd = astroDawn;
            let dsdDurationStr = "0시간 0분";

            if (!astroDusk || !astroDawn || isNaN(astroDusk.getTime()) || isNaN(astroDawn.getTime())) {
                dsdStart = null;
                dsdEnd = null;
                dsdDurationStr = "관측 불가 (백야)";
            } else {
                const moonSet = getValidMoonEvent(moonTimesToday.set, moonTimesNext.set, astroDusk, astroDawn);
                const moonRise = getValidMoonEvent(moonTimesToday.rise, moonTimesNext.rise, astroDusk, astroDawn);
                const moonPosAtDusk = SunCalc.getMoonPosition(astroDusk, state.location.lat, state.location.lng);
                const isMoonUpAtDusk = moonPosAtDusk.altitude > 0;

                if (isMoonUpAtDusk) {
                    if (moonSet) dsdStart = moonSet; 
                    else dsdStart = null;
                }
                
                if (moonRise && dsdStart && moonRise > dsdStart) {
                    dsdEnd = new Date(Math.min(dsdEnd.getTime(), moonRise.getTime()));
                }

                if (dsdStart && dsdEnd && dsdEnd > dsdStart) {
                    const dsdMs = dsdEnd.getTime() - dsdStart.getTime();
                    dsdDurationStr = `${Math.floor(dsdMs / 3600000)}시간 ${Math.floor((dsdMs % 3600000) / 60000)}분`;
                } else {
                    dsdStart = null;
                    dsdEnd = null;
                    dsdDurationStr = "관측 불가 (달빛)";
                }
            }
            
            const phaseInfo = getMoonPhaseInfo(moon.phase, 44);
            const moonAge = (moon.phase * 29.53058867).toFixed(1);

            state.data = {
                sunset: sunTimes.sunset, civilDusk: sunTimes.dusk, nautDusk: sunTimes.nauticalDusk, astroDusk: astroDusk,
                astroDawn: astroDawn, nautDawn: sunTimesNext.nauticalDawn, civilDawn: sunTimesNext.dawn, sunrise: sunTimesNext.sunrise,
                dsdStart: dsdStart, dsdEnd: dsdEnd, dsdDuration: dsdDurationStr, moonPhaseSvg: phaseInfo.svg,
                moonrise: moonTimesToday.rise, moonset: moonTimesToday.set, moonAge: moonAge
            };
            
            renderApp();
            if (updatePicker && state.view === 'home') {
                buildWheelPicker();
            } else {
                updateNativePickerValue();
            }
        }

        // --- 휠 피커 로직 (딱 3줄: 셀 높이 36px, 위아래 여백 36px) ---
        function buildWheelPicker() {
            const yCol = document.getElementById('wheel-year');
            const mCol = document.getElementById('wheel-month');
            if(!yCol || !mCol) return;
            
            const currentYear = state.date.getFullYear();
            const currentMonth = state.date.getMonth();
            currentMaxDays = new Date(currentYear, currentMonth + 1, 0).getDate();

            let yHtml = '<div class="h-[36px] w-full shrink-0"></div>';
            for(let i=2000; i<=2050; i++) {
                yHtml += `<div class="h-[36px] w-full shrink-0 snap-center flex justify-center items-center cursor-pointer transition-colors" data-val="${i}" onclick="setWheelDate('year', ${i})">${i}년</div>`;
            }
            yHtml += '<div class="h-[36px] w-full shrink-0"></div>';
            yCol.innerHTML = yHtml;

            let mHtml = '<div class="h-[36px] w-full shrink-0"></div>';
            for(let i=1; i<=12; i++) {
                mHtml += `<div class="h-[36px] w-full shrink-0 snap-center flex justify-center items-center cursor-pointer transition-colors" data-val="${i}" onclick="setWheelDate('month', ${i})">${i}월</div>`;
            }
            mHtml += '<div class="h-[36px] w-full shrink-0"></div>';
            mCol.innerHTML = mHtml;

            buildDayColumnInner(currentMaxDays);
            updateWheelClasses();
            syncWheelScrolls();
            updateNativePickerValue();
        }

        function buildDayColumnInner(maxDays) {
            const dCol = document.getElementById('wheel-day');
            if(!dCol) return;
            let dHtml = '<div class="h-[36px] w-full shrink-0"></div>';
            for(let i=1; i<=maxDays; i++) {
                dHtml += `<div class="h-[36px] w-full shrink-0 snap-center flex justify-center items-center cursor-pointer transition-colors" data-val="${i}" onclick="setWheelDate('day', ${i})">${i}일</div>`;
            }
            dHtml += '<div class="h-[36px] w-full shrink-0"></div>';
            dCol.innerHTML = dHtml;
        }

        function updateWheelClasses() {
            const y = state.date.getFullYear();
            const m = state.date.getMonth() + 1;
            const d = state.date.getDate();

            ['year', 'month', 'day'].forEach(type => {
                const col = document.getElementById(`wheel-${type}`);
                if (!col) return;
                const val = type === 'year' ? y : (type === 'month' ? m : d);
                const items = col.querySelectorAll('[data-val]');
                items.forEach(el => {
                    if (parseInt(el.dataset.val) === val) {
                        el.className = `h-[36px] w-full shrink-0 snap-center flex justify-center items-center cursor-pointer text-white font-bold text-base sm:text-lg transition-colors`;
                    } else {
                        el.className = `h-[36px] w-full shrink-0 snap-center flex justify-center items-center cursor-pointer text-gray-500 text-xs sm:text-sm hover:text-gray-300 transition-colors`;
                    }
                });
            });
        }

        function syncWheelScrolls() {
            isSyncing = true;
            const y = state.date.getFullYear();
            const m = state.date.getMonth() + 1;
            const d = state.date.getDate();

            const sync = (id, val) => {
                const col = document.getElementById(`wheel-${id}`);
                if (!col) return;
                const items = col.querySelectorAll('[data-val]');
                let index = 0;
                items.forEach((el, i) => { if (parseInt(el.dataset.val) === val) index = i; });
                col.scrollTo({ top: index * 36, behavior: 'smooth' }); // 셀 높이 36px
            };
            
            sync('year', y);
            sync('month', m);
            sync('day', d);
            setTimeout(() => isSyncing = false, 300);
        }

        function handleWheelScroll() {
            if(isSyncing) return;
            clearTimeout(wheelTimeout);
            wheelTimeout = setTimeout(() => {
                if(isSyncing) return;
                const yCol = document.getElementById('wheel-year');
                const mCol = document.getElementById('wheel-month');
                const dCol = document.getElementById('wheel-day');

                const yIndex = Math.round(yCol.scrollTop / 36);
                const mIndex = Math.round(mCol.scrollTop / 36);
                const dIndex = Math.round(dCol.scrollTop / 36);

                const yItems = yCol.querySelectorAll('[data-val]');
                const mItems = mCol.querySelectorAll('[data-val]');
                const dItems = dCol.querySelectorAll('[data-val]');

                const y = parseInt(yItems[Math.min(yIndex, yItems.length-1)]?.dataset.val || state.date.getFullYear());
                const m = parseInt(mItems[Math.min(mIndex, mItems.length-1)]?.dataset.val || state.date.getMonth() + 1) - 1;
                let d = parseInt(dItems[Math.min(dIndex, dItems.length-1)]?.dataset.val || state.date.getDate());

                const maxDays = new Date(y, m + 1, 0).getDate();
                let clamped = false;
                if (d > maxDays) {
                    d = maxDays;
                    clamped = true;
                }

                const newDate = new Date(y, m, d);
                if (newDate.getTime() !== state.date.getTime()) {
                    state.date = newDate;
                    if (maxDays !== currentMaxDays) {
                        currentMaxDays = maxDays;
                        buildDayColumnInner(maxDays);
                        clamped = true;
                    }
                    updateWheelClasses();
                    calculateData(false);
                    if (clamped) syncWheelScrolls();
                } else {
                    updateWheelClasses();
                }
            }, 150);
        }

        function setWheelDate(type, val) {
            let y = state.date.getFullYear();
            let m = state.date.getMonth();
            let d = state.date.getDate();

            if (type === 'year') y = val;
            if (type === 'month') m = val - 1;
            if (type === 'day') d = val;

            const maxDays = new Date(y, m + 1, 0).getDate();
            if (d > maxDays) d = maxDays;

            state.date = new Date(y, m, d);
            calculateData(true);
        }

        function updateNativePickerValue() {
            const nativePicker = document.getElementById('native-date');
            if (nativePicker) {
                const yyyy = state.date.getFullYear();
                const mm = String(state.date.getMonth() + 1).padStart(2, '0');
                const dd = String(state.date.getDate()).padStart(2, '0');
                nativePicker.value = `${yyyy}-${mm}-${dd}`;
            }
        }

        // --- 도구 이벤트 ---
        function goToToday() {
            state.date = new Date();
            calculateData(true);
        }

        function setDateFromPicker(e) {
            if (e.target.value) {
                state.date = new Date(e.target.value);
                calculateData(true);
            }
        }

        // --- 앱 뷰 관리 ---
        function setView(v) { 
            state.view = v;
            state.showMoonModal = false;
            if (v === 'moon') state.moonViewDate = new Date(state.date);
            
            const datePickerSection = document.getElementById('date-picker-section');
            const appContainer = document.getElementById('app');
            
            if (v === 'home') {
                if(datePickerSection) datePickerSection.style.display = 'flex';
                if(appContainer) {
                    appContainer.classList.remove('pb-24');
                    appContainer.classList.add('pb-48'); 
                }
            } else {
                if(datePickerSection) datePickerSection.style.display = 'none';
                if(appContainer) {
                    appContainer.classList.remove('pb-48');
                    appContainer.classList.add('pb-24'); 
                }
            }

            renderApp(); 
            document.getElementById('nav-home')?.classList.toggle('text-white', state.view === 'home');
            document.getElementById('nav-moon')?.classList.toggle('text-white', state.view === 'moon');
            document.getElementById('nav-map')?.classList.toggle('text-white', state.view === 'map');
        }

        function changeMoonMonth(offset) {
            state.moonViewDate.setMonth(state.moonViewDate.getMonth() + offset);
            renderApp();
        }

        function openMoonDetail(y, m, d) {
            state.modalDate = new Date(y, m, d);
            state.showMoonModal = true;
            renderApp();
        }

        function closeMoonDetail() {
            state.showMoonModal = false;
            renderApp();
        }

        function findLocation() {
            const lat = parseFloat(document.getElementById('lat-input').value);
            const lng = parseFloat(document.getElementById('lng-input').value);
            if (!isNaN(lat) && !isNaN(lng) && map) {
                map.setView([lat, lng], 10);
                marker.setLatLng([lat, lng]);
            }
        }

        function saveToList() {
            const lat = parseFloat(document.getElementById('lat-input').value);
            const lng = parseFloat(document.getElementById('lng-input').value);
            if (!isNaN(lat) && !isNaN(lng)) {
                const newLoc = { lat, lng, name: `관측지 (${lat.toFixed(2)}, ${lng.toFixed(2)})` };
                state.savedLocations = [newLoc, ...state.savedLocations.filter(l => l.lat !== lat || l.lng !== lng)].slice(0, 3);
                localStorage.setItem('saved_locs', JSON.stringify(state.savedLocations));
                alert('위치가 목록에 저장되었습니다.');
                renderApp();
            }
        }

        function confirmLocation() {
            const lat = parseFloat(document.getElementById('lat-input').value);
            const lng = parseFloat(document.getElementById('lng-input').value);
            if (!isNaN(lat) && !isNaN(lng)) {
                const newLoc = { lat, lng, name: `관측지 (${lat.toFixed(2)}, ${lng.toFixed(2)})` };
                state.location = newLoc;
                localStorage.setItem('dsd_loc', JSON.stringify(state.location));
                calculateData(false);
                setView('home');
            }
        }

        function getCurrentLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((position) => {
                    const lat = position.coords.latitude;
                    const lng = position.coords.longitude;
                    const latInput = document.getElementById('lat-input');
                    const lngInput = document.getElementById('lng-input');
                    if(latInput && lngInput) {
                        latInput.value = lat.toFixed(4);
                        lngInput.value = lng.toFixed(4);
                        findLocation();
                    }
                }, (error) => {
                    alert('위치 정보를 가져올 수 없습니다. 기기의 GPS 설정과 권한을 확인해주세요.');
                });
            } else {
                alert('이 브라우저에서는 위치 정보(GPS)를 지원하지 않습니다.');
            }
        }

        function deleteLocation(index) {
            state.savedLocations.splice(index, 1);
            localStorage.setItem('saved_locs', JSON.stringify(state.savedLocations));
            renderApp();
        }

        function moveToSaved(lat, lng) {
            document.getElementById('lat-input').value = lat;
            document.getElementById('lng-input').value = lng;
            findLocation();
        }

        function initMap() {
            const container = document.getElementById('map-container');
            if (!container) return;
            if (map !== null) { map.remove(); map = null; }
            map = L.map('map-container').setView([state.location.lat, state.location.lng], 10);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
            marker = L.marker([state.location.lat, state.location.lng]).addTo(map);
            map.on('click', (e) => {
                marker.setLatLng(e.latlng);
                document.getElementById('lat-input').value = e.latlng.lat.toFixed(4);
                document.getElementById('lng-input').value = e.latlng.lng.toFixed(4);
            });
        }

        // --- UI 렌더링 ---
        function renderApp() {
            const app = document.getElementById('app');

                                <div class="flex flex-col">
                                    <h2 class="text-sm uppercase text-purple-300 font-bold mb-1 flex items-center gap-1.5"><i data-lucide="moon" class="w-4 h-4"></i> DSD 시간 (진정한 어둠)</h2>
                                    <span class="font-bold text-2xl sm:text-3xl ${state.data?.dsdDuration.includes('불가') ? 'text-red-400' : 'text-green-400'}">${state.data?.dsdDuration || ''}</span>

                            </div>

                                    {l:'항해박명 끝', t:state.data?.nautDusk, c:'text-blue-300'},

                                        </div>
                                    </div>
                                `).join('')}
                            </div>

                            <!-- 새벽 시간 데이터 -->
                            <div class="bg-gray-900 p-3.5 sm:p-4 rounded-2xl border border-gray-800 shadow-lg min-w-[280px] snap-center shrink-0">
                                <h2 class="text-[14px] sm:text-[16px] uppercase text-gray-500 font-bold mb-3 flex items-center gap-1.5"><i data-lucide="sunrise" class="w-4 h-4 text-blue-300"></i> 새벽 데이터</h2>

                            </div>

                            <!-- 천체 출몰 및 월령 정보 -->

                                ${[
                                    {l:'일출', t:state.data?.sunrise, c:'text-orange-400'},
                                    {l:'일몰', t:state.data?.sunset, c:'text-orange-400'},
                                    {l:'월출', t:state.data?.moonrise, c:'text-blue-300'},
                                    {l:'월몰', t:state.data?.moonset, c:'text-orange-300'}
                                ].map(x => `
                                    <div class="flex justify-between items-center py-2 border-b border-gray-800/60 last:border-0">
                                        <span class="text-[14px] sm:text-[15px] font-bold ${x.c} whitespace-nowrap mr-2">${x.l}</span>
                                        <div class="flex items-center text-right shrink-0">
                                            ${formatDateBox(x.t)} 
                                            <span class="font-mono text-[15px] sm:text-[17px] font-bold ${x.c}">${formatTime(x.t)}</span>
                                        </div>
                                    </div>
                                `).join('')}
                                <div class="flex justify-between items-center py-2 pt-2.5 border-t border-gray-700/60 mt-1">
                                    <span class="text-[14px] sm:text-[15px] font-bold text-gray-300">월령</span>
                                    <span class="font-bold text-[16px] sm:text-[18px] text-gray-100">${state.data?.moonAge}일</span>
                                </div>
                            </div>
                        </div>

                    </div>
                `;
            } else if (state.view === 'moon') {
                const y = state.moonViewDate.getFullYear();
                const m = state.moonViewDate.getMonth();
                const firstDay = new Date(y, m, 1).getDay();
                const daysInMonth = new Date(y, m + 1, 0).getDate();
                
                let gridHtml = '';
                for (let i = 0; i < firstDay; i++) {
                    gridHtml += `<div></div>`;
                }

                for (let d = 1; d <= daysInMonth; d++) {
                    const currentDate = new Date(y, m, d, 12, 0, 0); 
                    const moon = SunCalc.getMoonIllumination(currentDate);
                    const moonSvg = getMoonPhaseInfo(moon.phase, 40).svg; 
                    
                    const isHomeSelected = (d === state.date.getDate() && m === state.date.getMonth() && y === state.date.getFullYear());
                    const isSunday = new Date(y, m, d).getDay() === 0;
                    const dateColor = isSunday ? 'text-red-500' : 'text-gray-300';
                    
                    gridHtml += `
                        <div class="flex flex-col items-center justify-center p-2 cursor-pointer transition-all ${isHomeSelected ? 'bg-blue-900/50 rounded-xl ring-2 ring-blue-400 shadow-[0_0_12px_rgba(59,130,246,0.6)]' : 'hover:bg-white/10 rounded-xl'}" onclick="openMoonDetail(${y}, ${m}, ${d})">
                            <span class="mb-2 flex justify-center w-full">${moonSvg}</span>
                            <span class="text-base sm:text-lg ${dateColor} font-bold">${d}</span>
                        </div>
                    `;
                }

                let modalHtml = '';
                if (state.showMoonModal && state.modalDate) {
                    const dDate = new Date(state.modalDate);
                    dDate.setHours(12, 0, 0, 0);
                    const dMoon = SunCalc.getMoonIllumination(dDate);
                    const dTimes = SunCalc.getMoonTimes(dDate, state.location.lat, state.location.lng);
                    const dSunTimes = SunCalc.getTimes(dDate, state.location.lat, state.location.lng);
                    const moonZodiac = getMoonZodiac(dDate);
                    
                    const phaseInfo = getMoonPhaseInfo(dMoon.phase, 120);
                    const moonAge = (dMoon.phase * 29.53058867).toFixed(1);
                    
                    let dayLengthStr = '--시간 --분';
                    if (dSunTimes.sunrise && dSunTimes.sunset) {
                        const dayLengthMs = dSunTimes.sunset.getTime() - dSunTimes.sunrise.getTime();
                        const dlHours = Math.floor(dayLengthMs / 3600000);
                        const dlMins = Math.floor((dayLengthMs % 3600000) / 60000);
                        dayLengthStr = `${dlHours}시간 ${dlMins}분`;
                    }
                    
                    modalHtml = `
                        <div class="absolute inset-0 z-50 flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm transition-opacity" onclick="closeMoonDetail()">

                                <div class="flex justify-between items-start mb-4">
                                    <div>
                                        <h3 class="text-xl font-bold">${state.modalDate.getMonth() + 1}월 ${state.modalDate.getDate()}일 상세</h3>
                                        <p class="text-gray-400 text-sm">${phaseInfo.name}</p>
                                    </div>
                                    <button onclick="closeMoonDetail()" class="text-gray-400 hover:text-white"><i data-lucide="x" class="w-6 h-6"></i></button>
                                </div>
                                
                                <div class="flex justify-center my-6">
                                    ${phaseInfo.svg}
                                </div>
                                
                                <div class="space-y-3 bg-gray-800/50 p-4 rounded-xl">
                                    <div class="flex justify-between border-b border-gray-700 pb-2">
                                        <span class="text-gray-400 text-sm">월령</span>
                                        <span class="font-bold">${moonAge}일</span>
                                    </div>
                                    <div class="flex justify-between border-b border-gray-700 pb-2">
                                        <span class="text-gray-400 text-sm">조명비 (밝기)</span>
                                        <span class="font-bold">${(dMoon.fraction * 100).toFixed(1)}%</span>
                                    </div>
                                    <div class="flex justify-between border-b border-gray-700 pb-2">
                                        <span class="text-gray-400 text-sm">월출 / 월몰</span>

                                    </div>
                                    <div class="flex justify-between border-b border-gray-700 pb-2">
                                        <span class="text-gray-400 text-sm">일출 / 일몰</span>
                                        <span class="font-mono"><span class="text-orange-400">${formatTime(dSunTimes.sunrise)}</span> <span class="text-gray-600">/</span> <span class="text-red-400">${formatTime(dSunTimes.sunset)}</span></span>

                        </div>
                    `;
                }

                app.innerHTML = `
                    <div class="min-h-full night-sky relative p-4 pt-10 pb-24">
                        <header class="flex justify-between items-center mb-8 px-2">
                            <button onclick="changeMoonMonth(-1)" class="p-2 rounded-full hover:bg-white/10 transition-colors">
                                <i data-lucide="chevron-left" class="w-6 h-6 text-gray-300"></i>
                            </button>
                            <h2 class="text-2xl font-bold tracking-widest text-white/90">${y}년 ${m + 1}월</h2>
                            <button onclick="changeMoonMonth(1)" class="p-2 rounded-full hover:bg-white/10 transition-colors">
                                <i data-lucide="chevron-right" class="w-6 h-6 text-gray-300"></i>
                            </button>
                        </header>
                        
                        <div class="grid grid-cols-7 gap-y-4 gap-x-1 mb-6">
                            ${['일', '월', '화', '수', '목', '금', '토'].map((day, i) => `
                                <div class="text-center text-sm font-bold ${i === 0 ? 'text-red-400' : 'text-gray-400'} mb-2">${day}</div>
                            `).join('')}
                            ${gridHtml}
                        </div>
                        ${modalHtml}
                    </div>
                `;
            } else if (state.view === 'map') {
                app.innerHTML = `
                    <div class="h-full flex flex-col pt-4 relative z-0">
                        <div class="px-4 pb-4 bg-gray-950 space-y-3 shrink-0">
                            <div class="flex justify-between items-center">
                                <h2 class="text-lg font-bold flex items-center gap-2"><i data-lucide="map" class="w-5 h-5"></i> 관측지 설정</h2>
                                <button onclick="getCurrentLocation()" class="bg-gray-800 hover:bg-gray-700 px-3 py-1.5 rounded-lg flex items-center gap-1 text-xs text-blue-400 transition-colors"><i data-lucide="navigation" class="w-3.5 h-3.5"></i> 현위치</button>
                            </div>
                            
                            <!-- 위치 설정 영역: 위도, 경도, 버튼 1줄 통합 구조 가운데 정렬 -->
                            <div class="flex justify-center items-center gap-2 overflow-x-auto whitespace-nowrap scrollbar-hide py-2 w-full">
                                <div class="flex items-center gap-1.5 shrink-0 bg-gray-900 px-3 py-2 rounded-xl border border-gray-800">
                                    <span class="text-sm font-bold text-gray-400">위도</span>
                                    <input id="lat-input" type="text" value="${state.location.lat.toFixed(4)}" class="w-20 bg-gray-800 p-1.5 rounded-lg text-white text-sm outline-none text-center font-mono">
                                </div>
                                <div class="flex items-center gap-1.5 shrink-0 bg-gray-900 px-3 py-2 rounded-xl border border-gray-800">
                                    <span class="text-sm font-bold text-gray-400">경도</span>
                                    <input id="lng-input" type="text" value="${state.location.lng.toFixed(4)}" class="w-20 bg-gray-800 p-1.5 rounded-lg text-white text-sm outline-none text-center font-mono">
                                </div>
                                <div class="flex items-center gap-1.5 shrink-0">
                                    <button onclick="findLocation()" class="bg-gray-700 hover:bg-gray-600 px-4 py-2.5 rounded-xl text-sm font-bold transition-colors flex items-center gap-1.5"><i data-lucide="search" class="w-4 h-4"></i>찾기</button>
                                    <button onclick="saveToList()" class="bg-gray-700 hover:bg-gray-600 px-4 py-2.5 rounded-xl text-sm font-bold transition-colors flex items-center gap-1.5"><i data-lucide="bookmark" class="w-4 h-4"></i>저장</button>
                                    <button onclick="confirmLocation()" class="bg-blue-600 hover:bg-blue-500 px-4 py-2.5 rounded-xl text-sm font-bold transition-colors flex items-center gap-1.5"><i data-lucide="check" class="w-4 h-4"></i>설정</button>
                                </div>
                            </div>
                            
                            <!-- 저장된 위치 가운데 정렬 및 글자/버튼 크기 상향 -->
                            <div class="mt-4 text-center">
                                <div class="text-sm font-bold text-gray-400 mb-3">저장된 위치 (최대 3개)</div>
                                <div class="flex justify-center gap-3 overflow-x-auto scrollbar-hide pb-1">
                                    ${state.savedLocations.map((loc, i) => `
                                        <div class="bg-gray-800 border border-gray-700 px-4 py-2 rounded-full text-sm flex items-center gap-2 flex-shrink-0 shadow-md">

                    </div>
                `;
                setTimeout(() => {
                    initMap();
                }, 100);
            }
            
            if(window.lucide) lucide.createIcons();
            updateClocks();
        }

        // 앱 초기 시작 로직 - 오늘 날짜 강제 고정 
        function initApp() {
            state.date = new Date();
            calculateData(true);
            setView('home');
            setTimeout(() => {
                syncWheelScrolls();
            }, 100);
        }
        
        window.onload = initApp;
    </script>
</body>
</html>
