<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>천체 관측 대시보드</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/suncalc/1.9.0/suncalc.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-950 text-white min-h-screen">
    <div id="app" class="pb-32"></div>

    <div id="controls" class="fixed bottom-0 w-full bg-gray-900 border-t border-gray-800 z-50">
        <div id="date-picker" class="p-4 overflow-x-auto flex gap-3 snap-x scrollbar-hide bg-gray-900 border-b border-gray-800"></div>
        <nav class="flex justify-around p-4 bg-gray-950">
            <button onclick="setView('home')" class="flex flex-col items-center"><span>홈</span></button>
            <button onclick="setView('map')" class="flex flex-col items-center"><span>위치</span></button>
        </nav>
    </div>

    <script>
        let state = {
            view: 'home',
            date: new Date(),
            location: JSON.parse(localStorage.getItem('dsd_loc')) || { lat: 35.22, lng: 128.68, name: "창원시" },
            data: null
        };

        let map, marker;

        function getMoonIconByPhase(phase) {
            if (phase < 0.03 || phase > 0.97) return "🌑";
            if (phase < 0.22) return "🌒";
            if (phase < 0.28) return "🌓";
            if (phase < 0.47) return "🌔";
            if (phase < 0.53) return "🌕";
            if (phase < 0.72) return "🌖";
            if (phase < 0.78) return "🌗";
            return "🌘";
        }

        function formatTime(t) {
            return t ? t.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false }) : '--:--';
        }

        function setView(v) { state.view = v; render(); }

        function calculateData() {
            const times = SunCalc.getTimes(state.date, state.location.lat, state.location.lng);
            const nextDay = new Date(state.date.getTime() + 86400000);
            const timesNext = SunCalc.getTimes(nextDay, state.location.lat, state.location.lng);
            const dsdMs = timesNext.nightEnd.getTime() - times.night.getTime();
            const moon = SunCalc.getMoonIllumination(state.date);
            
            state.data = {
                sunset: times.sunset, civilDusk: times.dusk, nautDusk: times.nauticalDusk, astroDusk: times.night,
                astroDawn: timesNext.nightEnd, nautDawn: timesNext.nauticalDawn, civilDawn: timesNext.dawn, sunrise: timesNext.sunrise,
                dsdDuration: `${Math.floor(dsdMs / 3600000)}시간 ${Math.floor((dsdMs % 3600000) / 60000)}분`,
                moonPhase: getMoonIconByPhase(moon.phase)
            };
            render();
        }

        function findLocation() {
            const lat = parseFloat(document.getElementById('lat-input').value);
            const lng = parseFloat(document.getElementById('lng-input').value);
            if (!isNaN(lat) && !isNaN(lng)) {
                map.setView([lat, lng], 10);
                marker.setLatLng([lat, lng]);
            }
        }

        function saveLocation() {
            const lat = parseFloat(document.getElementById('lat-input').value);
            const lng = parseFloat(document.getElementById('lng-input').value);
            if (!isNaN(lat) && !isNaN(lng)) {
                state.location = { lat, lng, name: `관측지 (${lat.toFixed(2)}, ${lng.toFixed(2)})` };
                localStorage.setItem('dsd_loc', JSON.stringify(state.location));
                calculateData(); // 즉시 데이터 재계산
                setView('home');
            }
        }

        function initMap() {
            if (map) map.remove();
            map = L.map('map-container').setView([state.location.lat, state.location.lng], 10);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
            marker = L.marker([state.location.lat, state.location.lng]).addTo(map);
            map.on('click', (e) => {
                marker.setLatLng(e.latlng);
                document.getElementById('lat-input').value = e.latlng.lat.toFixed(4);
                document.getElementById('lng-input').value = e.latlng.lng.toFixed(4);
            });
        }

        function render() {
            const app = document.getElementById('app');
            if (state.view === 'home') {
                app.innerHTML = `
                    <div class="p-6 space-y-6">
                        <header>
                            <h1 class="text-2xl font-bold">천체 관측 대시보드</h1>
                            <div class="flex items-center gap-3 mt-2">
                                <p class="text-xl font-bold text-green-400">DSD 관측 가능 시간: ${state.data?.dsdDuration || ''}</p>
                                <span class="text-3xl">${state.data?.moonPhase || ''}</span>
                            </div>
                            <p class="text-blue-400 text-sm mt-1 cursor-pointer" onclick="setView('map')">📍 ${state.location.name}</p>
                        </header>
                        <div class="bg-gray-900 p-6 rounded-2xl border border-gray-800">
                            <h2 class="text-xs uppercase text-gray-500 font-bold mb-4">저녁 시간 데이터</h2>
                            ${[{l:'일몰',t:state.data?.sunset},{l:'시민박명 끝',t:state.data?.civilDusk},{l:'항해박명 끝',t:state.data?.nautDusk},{l:'천문박명 끝',t:state.data?.astroDusk}].map(x => `<div class="flex justify-between py-2 border-b border-gray-800"><span>${x.l}</span><span class="font-mono">${formatTime(x.t)}</span></div>`).join('')}
                        </div>
                        <div class="bg-gray-800/50 p-6 rounded-2xl border border-gray-700">
                            <h2 class="text-xs uppercase text-gray-400 font-bold mb-4">DSD 시간</h2>
                            <div class="flex justify-between text-purple-400 font-mono text-sm">
                                <span>시작: ${formatTime(state.data?.astroDusk)}</span>
                                <span>끝: ${formatTime(state.data?.astroDawn)}</span>
                            </div>
                        </div>
                        <div class="bg-gray-900 p-6 rounded-2xl border border-gray-800">
                            <h2 class="text-xs uppercase text-gray-500 font-bold mb-4">새벽 시간 데이터</h2>
                            ${[{l:'천문박명 시작',t:state.data?.astroDawn},{l:'항해박명 시작',t:state.data?.nautDawn},{l:'시민박명 시작',t:state.data?.civilDawn},{l:'일출',t:state.data?.sunrise}].map(x => `<div class="flex justify-between py-2 border-b border-gray-800"><span>${x.l}</span><span class="font-mono">${formatTime(x.t)}</span></div>`).join('')}
                        </div>
                    </div>
                `;
            } else {
                app.innerHTML = `
                    <div class="h-screen flex flex-col">
                        <div class="p-4 bg-gray-900 border-b border-gray-800 space-y-2">
                            <div class="flex gap-2">
                                <input id="lat-input" type="text" value="${state.location.lat}" class="w-1/2 bg-gray-800 p-2 rounded text-white text-sm">
                                <input id="lng-input" type="text" value="${state.location.lng}" class="w-1/2 bg-gray-800 p-2 rounded text-white text-sm">
                            </div>
                            <div class="flex gap-2">
                                <button onclick="findLocation()" class="w-1/2 bg-gray-700 p-2 rounded text-sm">찾기</button>
                                <button onclick="saveLocation()" class="w-1/2 bg-blue-600 p-2 rounded text-sm font-bold">저장</button>
                            </div>
                        </div>
                        <div id="map-container" class="flex-grow"></div>
                    </div>
                `;
                setTimeout(initMap, 100);
            }
            renderDatePicker();
        }

        function renderDatePicker() {
            const container = document.getElementById('date-picker');
            container.innerHTML = '';
            for (let i = -7; i <= 14; i++) {
                const d = new Date();
                d.setDate(d.getDate() + i);
                const btn = document.createElement('button');
                btn.className = `snap-center flex-shrink-0 w-16 h-16 rounded-xl flex flex-col items-center justify-center border ${d.toDateString() === state.date.toDateString() ? 'bg-blue-600 border-blue-400' : 'bg-gray-800 border-gray-700'}`;
                btn.innerHTML = `<span class="text-[10px]">${d.getMonth()+1}월</span><span class="font-bold text-lg">${d.getDate()}</span>`;
                btn.onclick = () => { state.date = d; calculateData(); };
                container.appendChild(btn);
            }
        }

        calculateData();
    </script>
</body>
</html>
