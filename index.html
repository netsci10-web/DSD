<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>천체 관측 대시보드</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/suncalc/1.9.0/suncalc.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <style>
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
    </style>
</head>
<body class="bg-gray-950 text-white min-h-screen">
    <div id="app" class="pb-32">
        <!-- 컨텐츠가 여기에 렌더링됩니다 -->
    </div>

    <script>
        // 초기 데이터 및 상태 관리
        let state = {
            view: 'home',
            date: new Date(),
            location: JSON.parse(localStorage.getItem('dsd_loc')) || { lat: 35.22, lng: 128.68, name: "창원시" },
            data: null
        };

        function getMoonIconByPhase(phase) {
            if (phase < 0.03 || phase > 0.97) return "🌑";
            if (phase < 0.22) return "🌒";
            if (phase < 0.28) return "🌓";
            if (phase < 0.47) return "🌔";
            if (phase < 0.53) return "🌕";
            if (phase < 0.72) return "🌖";
            if (phase < 0.78) return "🌗";
            return "🌘";
        }

        function formatTime(t) {
            return t ? t.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', hour12: false }) : '--:--';
        }

        function calculateData() {
            const times = SunCalc.getTimes(state.date, state.location.lat, state.location.lng);
            const nextDay = new Date(state.date.getTime() + 86400000);
            const timesNext = SunCalc.getTimes(nextDay, state.location.lat, state.location.lng);
            const dsdMs = timesNext.nightEnd.getTime() - times.night.getTime();
            const moon = SunCalc.getMoonIllumination(state.date);
            
            state.data = {
                sunset: times.sunset, civilDusk: times.dusk, nautDusk: times.nauticalDusk, astroDusk: times.night,
                astroDawn: timesNext.nightEnd, nautDawn: timesNext.nauticalDawn, civilDawn: timesNext.dawn, sunrise: timesNext.sunrise,
                dsdDuration: `${Math.floor(dsdMs / 3600000)}시간 ${Math.floor((dsdMs % 3600000) / 60000)}분`,
                moonPhase: getMoonIconByPhase(moon.phase)
            };
            render();
        }

        function render() {
            const app = document.getElementById('app');
            if (state.view === 'home') {
                app.innerHTML = `
                    <div class="p-6 space-y-6">
                        <header>
                            <h1 class="text-2xl font-bold">천체 관측 대시보드</h1>
                            <div class="flex items-center gap-3 mt-2">
                                <p class="text-xl font-bold text-green-400">DSD 관측 가능 시간: ${state.data?.dsdDuration || ''}</p>
                                <span class="text-3xl">${state.data?.moonPhase || ''}</span>
                            </div>
                            <p class="text-blue-400 text-sm mt-1 cursor-pointer" onclick="state.view='map'; render();">📍 ${state.location.name}</p>
                        </header>
                        
                        <div class="bg-gray-900 p-6 rounded-2xl border border-gray-800">
                            <h2 class="text-xs uppercase text-gray-500 font-bold mb-4">저녁 시간 데이터</h2>
                            ${[{l:'일몰',t:state.data?.sunset},{l:'시민박명 끝',t:state.data?.civilDusk},{l:'항해박명 끝',t:state.data?.nautDusk},{l:'천문박명 끝',t:state.data?.astroDusk}].map(x => `<div class="flex justify-between py-2 border-b border-gray-800"><span>${x.l}</span><span class="font-mono">${formatTime(x.t)}</span></div>`).join('')}
                        </div>

                        <div class="bg-gray-800/50 p-6 rounded-2xl border border-gray-700">
                            <h2 class="text-xs uppercase text-gray-400 font-bold mb-4">DSD 핵심 시간</h2>
                            <div class="space-y-2 text-purple-400">
                                <div class="flex justify-between"><span class="text-sm">DSD 시작시간</span><span class="font-mono font-bold">${formatTime(state.data?.astroDusk)}</span></div>
                                <div class="flex justify-between"><span class="text-sm">DSD 끝시간</span><span class="font-mono font-bold">${formatTime(state.data?.astroDawn)}</span></div>
                            </div>
                        </div>
                    </div>
                `;
            }
        }

        // 초기 실행
        calculateData();
    </script>
</body>
</html>
