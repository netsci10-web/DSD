<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>천체 관측 대시보드</title>
    <!-- 외부 라이브러리: Tailwind CSS, SunCalc, Leaflet, Lucide Icons -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/suncalc/1.9.0/suncalc.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        /* 스크롤바 숨김 처리 */
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }
        
        /* 달력 배경용 밤하늘 그라데이션 */
        .night-sky {
            background: linear-gradient(to bottom, #071120 0%, #152845 50%, #1b3760 100%);
        }
    </style>
</head>
<body class="bg-gray-950 text-white min-h-screen flex flex-col">
    <!-- 메인 앱 컨텐츠 렌더링 영역 -->
    <div id="app" class="flex-grow pb-48 relative transition-all duration-300"></div>

    <!-- 달 상세 모달 렌더링 영역 (z-index 9999로 최상단 덮기 보장) -->
    <div id="modal-root"></div>

    <!-- 고정 네비게이션 및 날짜 선택기 (하단) -->
    <div id="controls" class="fixed bottom-0 w-full bg-gray-900 border-t border-gray-800 z-50">
        
        <!-- 상하 스크롤 휠 피커 및 좌우 도구 (높이 108px 딱 3줄로 최적화) -->
        <div id="date-picker-section" class="flex justify-between items-center border-b border-gray-800 h-[108px] transition-all duration-300 px-3 sm:px-6">
            
            <div class="flex items-center justify-center shrink-0 w-14">
                <button onclick="goToToday()" class="bg-gray-800 hover:bg-gray-700 text-white rounded-2xl flex items-center justify-center w-12 h-12 transition-colors shadow-lg border border-gray-700" title="오늘로 가기">
                    <i data-lucide="calendar-check" class="w-6 h-6 text-blue-400"></i>
                </button>
            </div>
            
            <div id="wheel-picker-container" class="flex-grow relative overflow-hidden h-[108px] flex justify-center items-center max-w-[280px] mx-auto">
                <div class="absolute top-1/2 -translate-y-1/2 w-full h-[36px] bg-blue-600/20 border-y border-blue-500/40 rounded-lg pointer-events-none"></div>
                <div class="flex w-full justify-center gap-1 sm:gap-3 h-full px-1">
                    <div class="relative h-full overflow-y-auto snap-y snap-mandatory scrollbar-hide flex-1 flex flex-col items-center" id="wheel-year" onscroll="handleWheelScroll()"></div>
                    <div class="relative h-full overflow-y-auto snap-y snap-mandatory scrollbar-hide flex-1 flex flex-col items-center" id="wheel-month" onscroll="handleWheelScroll()"></div>
                    <div class="relative h-full overflow-y-auto snap-y snap-mandatory scrollbar-hide flex-1 flex flex-col items-center" id="wheel-day" onscroll="handleWheelScroll()"></div>
                </div>
            </div>

            <div class="flex items-center justify-center shrink-0 w-14">
                <div class="relative w-12 h-12 bg-gray-800 hover:bg-gray-700 rounded-2xl transition-colors shadow-lg border border-gray-700" title="달력 선택">
                    <input type="date" id="native-date" onchange="setDateFromPicker(event)" class="absolute inset-0 opacity-0 cursor-pointer w-full h-full">
                    <div class="text-white flex items-center justify-center h-full w-full pointer-events-none">
                        <i data-lucide="calendar-days" class="w-6 h-6 text-gray-300"></i>
                    </div>
                </div>
            </div>
        </div>

        <!-- 하단 네비게이션 탭 -->
        <nav class="flex justify-around p-3 bg-gray-950 text-gray-400">
            <button onclick="setView('home')" class="flex flex-col items-center hover:text-white transition-colors w-1/4" id="nav-home">
                <i data-lucide="telescope" class="w-6 h-6 mb-1"></i><span class="text-[10px]">홈</span>
            </button>
            <button onclick="setView('moon')" class="flex flex-col items-center hover:text-white transition-colors w-1/4" id="nav-moon">
                <i data-lucide="moon" class="w-6 h-6 mb-1"></i><span class="text-[10px]">달</span>
            </button>
            <button onclick="setView('weather')" class="flex flex-col items-center hover:text-white transition-colors w-1/4" id="nav-weather">
                <i data-lucide="cloud-sun" class="w-6 h-6 mb-1"></i><span class="text-[10px]">날씨</span>
            </button>
            <button onclick="setView('map')" class="flex flex-col items-center hover:text-white transition-colors w-1/4" id="nav-map">
                <i data-lucide="map-pin" class="w-6 h-6 mb-1"></i><span class="text-[10px]">위치</span>
            </button>
        </nav>
    </div>

    <script>
        // --- 전역 상태 관리 ---
        let state = {
            view: 'home',
            date: new Date(), 
            location: JSON.parse(localStorage.getItem('dsd_loc')) || { lat: 35.22, lng: 128.68, name: "창원시" },
            savedLocations: JSON.parse(localStorage.getItem('saved_locs')) || [],
            data: null,
            currentWeather: null, // Open-Meteo 날씨 위젯용
            astroWeather: null,   // 7Timer! 천체 관측 예보용
            showMoonModal: false,
            modalDate: null,
            moonViewDate: new Date()
        };

        let map = null;
        let marker = null;
        let currentMaxDays = 31;
        let isSyncing = false;
        let wheelTimeout;

        // --- 실시간 시계 업데이트 (2줄 분리) ---
        function updateClocks() {
            const now = new Date();
            const dateEl = document.getElementById('clock-date');
            const lstEl = document.getElementById('clock-lst');
            const utcEl = document.getElementById('clock-utc');
            if (dateEl && lstEl && utcEl) {
                dateEl.textContent = `${now.getFullYear()}.${String(now.getMonth()+1).padStart(2,'0')}.${String(now.getDate()).padStart(2,'0')}`;
                lstEl.textContent = `LST ${now.toLocaleTimeString('ko-KR', { hour12: false, hour: '2-digit', minute: '2-digit', second: '2-digit' })}`;
                utcEl.textContent = `UTC ${String(now.getUTCHours()).padStart(2, '0')}:${String(now.getUTCMinutes()).padStart(2, '0')}:${String(now.getUTCSeconds()).padStart(2, '0')}`;
            }
        }
        setInterval(updateClocks, 1000);

        // --- 날씨 코드 파싱 (WMO 규격) ---
        function getWeatherDesc(code) {
            if(code === 0) return {desc: '맑음', icon: 'sun', color: 'text-yellow-400'};
            if(code === 1 || code === 2) return {desc: '구름 조금', icon: 'cloud-sun', color: 'text-gray-300'};
            if(code === 3) return {desc: '흐림', icon: 'cloud', color: 'text-gray-400'};
            if(code >= 45 && code <= 48) return {desc: '안개', icon: 'cloud-fog', color: 'text-gray-500'};
            if(code >= 51 && code <= 69) return {desc: '비', icon: 'cloud-rain', color: 'text-blue-400'};
            if(code >= 71 && code <= 79) return {desc: '눈', icon: 'snowflake', color: 'text-white'};
            if(code >= 80 && code <= 99) return {desc: '소나기/뇌우', icon: 'cloud-lightning', color: 'text-indigo-400'};
            return {desc: '알 수 없음', icon: 'cloud', color: 'text-gray-500'};
        }

        // --- 안정적인 글로벌 날씨 API (Open-Meteo) 호출 ---
        async function fetchCurrentWeather() {
            state.currentWeather = null;
            // CORS 에러가 발생하지 않는 무료 글로벌 API 사용
            const url = `https://api.open-meteo.com/v1/forecast?latitude=${state.location.lat}&longitude=${state.location.lng}&current=temperature_2m,relative_humidity_2m,weather_code,cloud_cover,visibility&timezone=auto`;
            
            try {
                const res = await fetch(url);
                const data = await res.json();
                const cur = data.current;
                
                const wInfo = getWeatherDesc(cur.weather_code);
                
                // 시정(가시거리) 계산
                const visKm = (cur.visibility / 1000).toFixed(1);
                let visStatus = "불량";
                let visColor = "bg-red-500";
                if (cur.visibility >= 10000) { visStatus = "양호"; visColor = "bg-blue-500"; }
                else if (cur.visibility >= 5000) { visStatus = "보통"; visColor = "bg-green-500"; }

                state.currentWeather = {
                    temp: Math.round(cur.temperature_2m),
                    humidity: Math.round(cur.relative_humidity_2m),
                    cloud: cur.cloud_cover,
                    visibility: visKm,
                    desc: wInfo.desc,
                    icon: wInfo.icon,
                    color: wInfo.color,
                    visStatus: visStatus,
                    visColor: visColor
                };
            } catch(e) {
                console.error("날씨 정보 로드 실패:", e);
            }
            if(state.view === 'home') renderApp();
        }

        // --- 7Timer! 천체 예보 호출 (안정화) ---
        async function fetchAstroWeather() {
            state.astroWeather = null;
            const targetUrl = `https://www.7timer.info/bin/api.pl?lon=${state.location.lng}&lat=${state.location.lat}&product=astro&output=json`;
            try {
                // allorigins 프록시 사용
                const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(targetUrl)}`;
                const response = await fetch(proxyUrl);
                const proxyData = await response.json();
                const data = JSON.parse(proxyData.contents);
                if (data && data.dataseries) {
                    state.astroWeather = data.dataseries;
                }
            } catch (e) {
                console.warn("7Timer 천체 예보 로드 실패", e);
            }
            if (state.view === 'weather') renderApp();
        }

        // --- 천체 및 달 위상 렌더링 함수들 ---
        function getMoonZodiac(date) {
            if (!date || isNaN(date.getTime())) return "알 수 없음";
            const jd = (date.getTime() / 86400000) + 2440587.5;
            const d = jd - 2451545.0; 
            let L = (218.316 + 13.176396 * d) % 360;
            if (L < 0) L += 360;
            let M = (134.963 + 13.064993 * d) % 360;
            if (M < 0) M += 360;
            let lambda = (L + 6.289 * Math.sin(M * Math.PI / 180)) % 360;
            if (lambda < 0) lambda += 360;
            const zodiacs = ["양자리 (Aries)", "황소자리 (Taurus)", "쌍둥이자리 (Gemini)", "게자리 (Cancer)", "사자자리 (Leo)", "처녀자리 (Virgo)", "천칭자리 (Libra)", "전갈자리 (Scorpio)", "궁수자리 (Sagittarius)", "염소자리 (Capricorn)", "물병자리 (Aquarius)", "물고기자리 (Pisces)"];
            return zodiacs[Math.floor(lambda / 30)] || "알 수 없음";
        }

        function renderRealisticMoon(phase, size = 40) {
            let rx = Math.max(0.001, 0.5 * Math.abs(Math.cos(phase * 2 * Math.PI)));
            let path = "";
            if (phase <= 0.5) {
                let sweep = phase <= 0.25 ? 0 : 1;
                path = `M 0.5,0 A 0.5,0.5 0 0,1 0.5,1 A ${rx},0.5 0 0,${sweep} 0.5,0 Z`;
            } else {
                let sweep = phase <= 0.75 ? 0 : 1;
                path = `M 0.5,0 A 0.5,0.5 0 0,0 0.5,1 A ${rx},0.5 0 0,${sweep} 0.5,0 Z`;
            }
            const imgUrl = "https://upload.wikimedia.org/wikipedia/commons/e/e1/FullMoon2010.jpg";
            const uid = Math.random().toString(36).substring(2, 9);
            const clipId = `moonClip-${uid}`;
            return `
                <div style="position: relative; width: ${size}px; height: ${size}px; border-radius: 50%; background: #000; box-shadow: 0 0 8px rgba(255,255,255,0.15); display: inline-flex; overflow: hidden; flex-shrink: 0;">
                    <svg width="0" height="0" style="position: absolute; width: 0; height: 0;">
                        <defs><clipPath id="${clipId}" clipPathUnits="objectBoundingBox"><path d="${path}" /></clipPath></defs>
                    </svg>
                    <img src="${imgUrl}" alt="moon" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; opacity: 0.2; filter: grayscale(100%);" crossorigin="anonymous">
                    <div style="position: absolute; inset: 0; clip-path: url(#${clipId}); -webkit-clip-path: url(#${clipId});">
                        <img src="${imgUrl}" alt="moon" style="position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; filter: grayscale(100%);" crossorigin="anonymous">
                    </div>
                    <div style="position: absolute; inset: 0; border-radius: 50%; border: 1px solid rgba(255,255,255,0.15);"></div>
                </div>
            `;
        }

        function getMoonPhaseInfo(phase, size = 40) {
            let name = "";
            if (phase < 0.03 || phase > 0.97) name = "신월 (삭)";
            else if (phase < 0.22) name = "초승달";
            else if (phase < 0.28) name = "상현달";
            else if (phase < 0.47) name = "상현 이후";
            else if (phase < 0.53) name = "보름달 (망)";
            else if (phase < 0.72) name = "하현 이전";
            else if (phase < 0.78) name = "하현달";
            else name = "그믐달";
            return { svg: renderRealisticMoon(phase, size), name: name };
        }

        function formatTime(t) {
            if (!t || isNaN(t.getTime())) return '--:--';
            return t.toLocaleTimeString('ko-KR', { hour: '2-digit', minute: '2-digit', hour12: false });
        }

        function formatDateBox(t) {
            if (!t || isNaN(t.getTime())) return '';
            const dayOfWeek = ['일', '월', '화', '수', '목', '금', '토'][t.getDay()];
            return `<span class="bg-gray-800 border border-gray-700 text-gray-300 px-1.5 py-0.5 rounded text-[10px] sm:text-xs shadow-sm">${t.getMonth() + 1}/${t.getDate()}(${dayOfWeek})</span>`;
        }

        function getValidMoonEvent(eventToday, eventNext, dusk, dawn) {
            if (eventToday && eventToday >= dusk && eventToday <= dawn) return eventToday;
            if (eventNext && eventNext >= dusk && eventNext <= dawn) return eventNext;
            return null;
        }

        function calculateData(updatePicker = true) {
            const baseDate = new Date(state.date);
            baseDate.setHours(12, 0, 0, 0); 
            const nextDay = new Date(baseDate.getTime() + 86400000);

            const sunTimes = SunCalc.getTimes(baseDate, state.location.lat, state.location.lng);
            const sunTimesNext = SunCalc.getTimes(nextDay, state.location.lat, state.location.lng);
            const moonTimesToday = SunCalc.getMoonTimes(baseDate, state.location.lat, state.location.lng);
            const moonTimesNext = SunCalc.getMoonTimes(nextDay, state.location.lat, state.location.lng);
            const moon = SunCalc.getMoonIllumination(baseDate);

            const astroDusk = sunTimes.night;
            const astroDawn = sunTimesNext.nightEnd;

            let dsdStart = astroDusk;
            let dsdEnd = astroDawn;
            let dsdDurationStr = "0시간 0분";

            if (!astroDusk || !astroDawn || isNaN(astroDusk.getTime()) || isNaN(astroDawn.getTime())) {
                dsdStart = null;
                dsdEnd = null;
                dsdDurationStr = "관측 불가 (백야)";
            } else {
                const moonSet = getValidMoonEvent(moonTimesToday.set, moonTimesNext.set, astroDusk, astroDawn);
                const moonRise = getValidMoonEvent(moonTimesToday.rise, moonTimesNext.rise, astroDusk, astroDawn);
                const moonPosAtDusk = SunCalc.getMoonPosition(astroDusk, state.location.lat, state.location.lng);
                const isMoonUpAtDusk = moonPosAtDusk.altitude > 0;

                if (isMoonUpAtDusk) {
                    if (moonSet) dsdStart = moonSet; 
                    else dsdStart = null;
                }
                
                if (moonRise && dsdStart && moonRise > dsdStart) {
                    dsdEnd = new Date(Math.min(dsdEnd.getTime(), moonRise.getTime()));
                }

                if (dsdStart && dsdEnd && dsdEnd > dsdStart) {
                    const dsdMs = dsdEnd.getTime() - dsdStart.getTime();
                    dsdDurationStr = `${Math.floor(dsdMs / 3600000)}시간 ${Math.floor((dsdMs % 3600000) / 60000)}분`;
                } else {
                    dsdStart = null;
                    dsdEnd = null;
                    dsdDurationStr = "관측 불가 (달빛)";
                }
            }
            
            const phaseInfo = getMoonPhaseInfo(moon.phase, 52); // 크기 약간 키움
            const moonAge = (moon.phase * 29.53058867).toFixed(1);

            state.data = {
                sunset: sunTimes.sunset, civilDusk: sunTimes.dusk, nautDusk: sunTimes.nauticalDusk, astroDusk: astroDusk,
                astroDawn: astroDawn, nautDawn: sunTimesNext.nauticalDawn, civilDawn: sunTimesNext.dawn, sunrise: sunTimesNext.sunrise,
                dsdStart: dsdStart, dsdEnd: dsdEnd, dsdDuration: dsdDurationStr, moonPhaseSvg: phaseInfo.svg,
                moonrise: moonTimesToday.rise, moonset: moonTimesToday.set, moonAge: moonAge
            };
            
            renderApp();
            if (updatePicker && state.view === 'home') {
                buildWheelPicker();
            } else {
                updateNativePickerValue();
            }
        }

        // --- 휠 피커 로직 ---
        function buildWheelPicker() {
            const yCol = document.getElementById('wheel-year');
            const mCol = document.getElementById('wheel-month');
            if(!yCol || !mCol) return;
            const currentYear = state.date.getFullYear();
            const currentMonth = state.date.getMonth();
            currentMaxDays = new Date(currentYear, currentMonth + 1, 0).getDate();

            let yHtml = '<div class="h-[36px] w-full shrink-0"></div>';
            for(let i=2000; i<=2050; i++) yHtml += `<div class="h-[36px] w-full shrink-0 snap-center flex justify-center items-center cursor-pointer transition-colors" data-val="${i}" onclick="setWheelDate('year', ${i})">${i}년</div>`;
            yHtml += '<div class="h-[36px] w-full shrink-0"></div>';
            yCol.innerHTML = yHtml;

            let mHtml = '<div class="h-[36px] w-full shrink-0"></div>';
            for(let i=1; i<=12; i++) mHtml += `<div class="h-[36px] w-full shrink-0 snap-center flex justify-center items-center cursor-pointer transition-colors" data-val="${i}" onclick="setWheelDate('month', ${i})">${i}월</div>`;
            mHtml += '<div class="h-[36px] w-full shrink-0"></div>';
            mCol.innerHTML = mHtml;

            buildDayColumnInner(currentMaxDays);
            updateWheelClasses();
            syncWheelScrolls();
            updateNativePickerValue();
        }

        function buildDayColumnInner(maxDays) {
            const dCol = document.getElementById('wheel-day');
            if(!dCol) return;
            let dHtml = '<div class="h-[36px] w-full shrink-0"></div>';
            for(let i=1; i<=maxDays; i++) dHtml += `<div class="h-[36px] w-full shrink-0 snap-center flex justify-center items-center cursor-pointer transition-colors" data-val="${i}" onclick="setWheelDate('day', ${i})">${i}일</div>`;
            dHtml += '<div class="h-[36px] w-full shrink-0"></div>';
            dCol.innerHTML = dHtml;
        }

        function updateWheelClasses() {
            const y = state.date.getFullYear(), m = state.date.getMonth() + 1, d = state.date.getDate();
            ['year', 'month', 'day'].forEach(type => {
                const col = document.getElementById(`wheel-${type}`);
                if (!col) return;
                const val = type === 'year' ? y : (type === 'month' ? m : d);
                col.querySelectorAll('[data-val]').forEach(el => {
                    if (parseInt(el.dataset.val) === val) el.className = `h-[36px] w-full shrink-0 snap-center flex justify-center items-center cursor-pointer text-white font-bold text-base sm:text-lg transition-colors`;
                    else el.className = `h-[36px] w-full shrink-0 snap-center flex justify-center items-center cursor-pointer text-gray-500 text-xs sm:text-sm hover:text-gray-300 transition-colors`;
                });
            });
        }

        function syncWheelScrolls() {
            isSyncing = true;
            const y = state.date.getFullYear(), m = state.date.getMonth() + 1, d = state.date.getDate();
            const sync = (id, val) => {
                const col = document.getElementById(`wheel-${id}`);
                if (!col) return;
                const items = col.querySelectorAll('[data-val]');
                let index = 0;
                items.forEach((el, i) => { if (parseInt(el.dataset.val) === val) index = i; });
                col.scrollTo({ top: index * 36, behavior: 'smooth' }); 
            };
            sync('year', y); sync('month', m); sync('day', d);
            setTimeout(() => isSyncing = false, 300);
        }

        function handleWheelScroll() {
            if(isSyncing) return;
            clearTimeout(wheelTimeout);
            wheelTimeout = setTimeout(() => {
                if(isSyncing) return;
                const yCol = document.getElementById('wheel-year'), mCol = document.getElementById('wheel-month'), dCol = document.getElementById('wheel-day');
                const yItems = yCol.querySelectorAll('[data-val]'), mItems = mCol.querySelectorAll('[data-val]'), dItems = dCol.querySelectorAll('[data-val]');
                const y = parseInt(yItems[Math.min(Math.round(yCol.scrollTop/36), yItems.length-1)]?.dataset.val || state.date.getFullYear());
                const m = parseInt(mItems[Math.min(Math.round(mCol.scrollTop/36), mItems.length-1)]?.dataset.val || state.date.getMonth() + 1) - 1;
                let d = parseInt(dItems[Math.min(Math.round(dCol.scrollTop/36), dItems.length-1)]?.dataset.val || state.date.getDate());

                const maxDays = new Date(y, m + 1, 0).getDate();
                let clamped = false;
                if (d > maxDays) { d = maxDays; clamped = true; }

                const newDate = new Date(y, m, d);
                if (newDate.getTime() !== state.date.getTime()) {
                    state.date = newDate;
                    if (maxDays !== currentMaxDays) { currentMaxDays = maxDays; buildDayColumnInner(maxDays); clamped = true; }
                    updateWheelClasses();
                    calculateData(false);
                    if (clamped) syncWheelScrolls();
                } else { updateWheelClasses(); }
            }, 150);
        }

        function setWheelDate(type, val) {
            let y = state.date.getFullYear(), m = state.date.getMonth(), d = state.date.getDate();
            if (type === 'year') y = val;
            if (type === 'month') m = val - 1;
            if (type === 'day') d = val;
            const maxDays = new Date(y, m + 1, 0).getDate();
            if (d > maxDays) d = maxDays;
            state.date = new Date(y, m, d);
            calculateData(true);
        }

        function updateNativePickerValue() {
            const picker = document.getElementById('native-date');
            if (picker) {
                picker.value = `${state.date.getFullYear()}-${String(state.date.getMonth() + 1).padStart(2, '0')}-${String(state.date.getDate()).padStart(2, '0')}`;
            }
        }

        function goToToday() { state.date = new Date(); calculateData(true); }
        function setDateFromPicker(e) { if (e.target.value) { state.date = new Date(e.target.value); calculateData(true); } }

        // --- 앱 뷰 관리 ---
        function setView(v) { 
            state.view = v;
            state.showMoonModal = false;
            renderModal(); // 모달 닫기
            
            if (v === 'moon') state.moonViewDate = new Date(state.date);
            
            const datePickerSection = document.getElementById('date-picker-section');
            const appContainer = document.getElementById('app');
            
            if (v === 'home') {
                if(datePickerSection) datePickerSection.style.display = 'flex';
                if(appContainer) { appContainer.classList.remove('pb-24'); appContainer.classList.add('pb-48'); }
                if(!state.currentWeather) fetchCurrentWeather();
            } else {
                if(datePickerSection) datePickerSection.style.display = 'none';
                if(appContainer) { appContainer.classList.remove('pb-48'); appContainer.classList.add('pb-24'); }
            }

            renderApp(); 
            ['home', 'moon', 'weather', 'map'].forEach(id => {
                const el = document.getElementById(`nav-${id}`);
                if (el) el.classList.toggle('text-white', v === id);
            });

            if (v === 'weather') fetchAstroWeather(); 
        }

        function changeMoonMonth(offset) { state.moonViewDate.setMonth(state.moonViewDate.getMonth() + offset); renderApp(); }

        // --- 상세 모달창 제어 (z-[9999] 보장) ---
        function openMoonDetail(y, m, d) {
            state.modalDate = new Date(y, m, d);
            state.showMoonModal = true;
            renderModal();
        }

        function closeMoonDetail() {
            state.showMoonModal = false;
            renderModal();
        }

        // 모달창만 독립적으로 렌더링하는 함수 (메인 렌더링과 분리하여 스크롤 오작동 방지)
        function renderModal() {
            const root = document.getElementById('modal-root');
            if (!state.showMoonModal || !state.modalDate) {
                root.innerHTML = '';
                return;
            }

            const dDate = new Date(state.modalDate);
            dDate.setHours(12, 0, 0, 0);
            const dMoon = SunCalc.getMoonIllumination(dDate);
            const dTimes = SunCalc.getMoonTimes(dDate, state.location.lat, state.location.lng);
            const dSunTimes = SunCalc.getTimes(dDate, state.location.lat, state.location.lng);
            const moonZodiac = getMoonZodiac(dDate);
            const phaseInfo = getMoonPhaseInfo(dMoon.phase, 120);
            const moonAge = (dMoon.phase * 29.53058867).toFixed(1);
            
            let dayLengthStr = '--시간 --분';
            if (dSunTimes.sunrise && dSunTimes.sunset) {
                const dayLengthMs = dSunTimes.sunset.getTime() - dSunTimes.sunrise.getTime();
                const dlHours = Math.floor(dayLengthMs / 3600000);
                const dlMins = Math.floor((dayLengthMs % 3600000) / 60000);
                dayLengthStr = `${dlHours}시간 ${dlMins}분`;
            }
            
            root.innerHTML = `
                <div class="fixed inset-0 z-[9999] flex items-center justify-center p-4 bg-black/80 backdrop-blur-sm transition-opacity" onclick="closeMoonDetail()">
                    <div class="bg-gray-900 border border-gray-700 p-6 rounded-3xl shadow-[0_0_40px_rgba(0,0,0,0.8)] w-full max-w-sm" onclick="event.stopPropagation()">

                                <h3 class="text-xl font-bold">${state.modalDate.getMonth() + 1}월 ${state.modalDate.getDate()}일 상세</h3>
                                <p class="text-gray-400 text-sm">${phaseInfo.name}</p>
                            </div>
                            <button onclick="closeMoonDetail()" class="text-gray-400 hover:text-white"><i data-lucide="x" class="w-6 h-6"></i></button>
                        </div>
                        <div class="flex justify-center my-6">${phaseInfo.svg}</div>
                        <div class="space-y-3 bg-gray-800/50 p-4 rounded-xl">
                            <div class="flex justify-between border-b border-gray-700 pb-2"><span class="text-gray-400 text-sm">월령</span><span class="font-bold">${moonAge}일</span></div>
                            <div class="flex justify-between border-b border-gray-700 pb-2"><span class="text-gray-400 text-sm">조명비 (밝기)</span><span class="font-bold">${(dMoon.fraction * 100).toFixed(1)}%</span></div>
                            <div class="flex justify-between border-b border-gray-700 pb-2"><span class="text-gray-400 text-sm">월출 / 월몰</span><span class="font-mono"><span class="text-blue-300">${formatTime(dTimes.rise)}</span> <span class="text-gray-600">/</span> <span class="text-orange-300">${formatTime(dTimes.set)}</span></span></div>
                            <div class="flex justify-between border-b border-gray-700 pb-2"><span class="text-gray-400 text-sm">일출 / 일몰</span><span class="font-mono"><span class="text-orange-400">${formatTime(dSunTimes.sunrise)}</span> <span class="text-gray-600">/</span> <span class="text-red-400">${formatTime(dSunTimes.sunset)}</span></span></div>
                            <div class="flex justify-between border-b border-gray-700 pb-2"><span class="text-gray-400 text-sm">낮의 길이</span><span class="font-bold">${dayLengthStr}</span></div>
                            <div class="flex justify-between items-center pt-1"><span class="text-gray-400 text-sm flex items-center gap-1"><i data-lucide="sparkles" class="w-4 h-4"></i> 달 위치 (별자리)</span><span class="font-bold text-blue-300">${moonZodiac}</span></div>
                        </div>
                    </div>
                </div>
            `;
            lucide.createIcons();

        // --- 위치 설정 및 지도 ---
        function findLocation() {
            const lat = parseFloat(document.getElementById('lat-input').value);
            const lng = parseFloat(document.getElementById('lng-input').value);
            if (!isNaN(lat) && !isNaN(lng) && map) { map.setView([lat, lng], 10); marker.setLatLng([lat, lng]); }
        }

        function saveToList() {
            const lat = parseFloat(document.getElementById('lat-input').value);
            const lng = parseFloat(document.getElementById('lng-input').value);
            if (!isNaN(lat) && !isNaN(lng)) {
                const newLoc = { lat, lng, name: `관측지 (${lat.toFixed(2)}, ${lng.toFixed(2)})` };
                state.savedLocations = [newLoc, ...state.savedLocations.filter(l => l.lat !== lat || l.lng !== lng)].slice(0, 3);
                localStorage.setItem('saved_locs', JSON.stringify(state.savedLocations));
                alert('위치가 목록에 저장되었습니다.');
                renderApp();
            }
        }

        function confirmLocation() {
            const lat = parseFloat(document.getElementById('lat-input').value);
            const lng = parseFloat(document.getElementById('lng-input').value);
            if (!isNaN(lat) && !isNaN(lng)) {
                state.location = { lat, lng, name: `관측지 (${lat.toFixed(2)}, ${lng.toFixed(2)})` };
                localStorage.setItem('dsd_loc', JSON.stringify(state.location));
                calculateData(false);
                fetchCurrentWeather(); // 위치 변경시 날씨 새로고침
                setView('home');
            }
        }

        function getCurrentLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition((position) => {
                    const latInput = document.getElementById('lat-input');
                    const lngInput = document.getElementById('lng-input');
                    if(latInput && lngInput) {
                        latInput.value = position.coords.latitude.toFixed(4);
                        lngInput.value = position.coords.longitude.toFixed(4);
                        findLocation();
                    }
                }, () => alert('위치 정보를 가져올 수 없습니다. 기기의 GPS 설정과 권한을 확인해주세요.'));
            } else alert('이 브라우저에서는 위치 정보(GPS)를 지원하지 않습니다.');
        }

        function deleteLocation(index) {
            state.savedLocations.splice(index, 1);
            localStorage.setItem('saved_locs', JSON.stringify(state.savedLocations));
            renderApp();
        }

        function moveToSaved(lat, lng) {
            document.getElementById('lat-input').value = lat;
            document.getElementById('lng-input').value = lng;
            findLocation();
        }

        function initMap() {
            const container = document.getElementById('map-container');
            if (!container) return;
            if (map !== null) { map.remove(); map = null; }
            map = L.map('map-container').setView([state.location.lat, state.location.lng], 10);
            L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
            marker = L.marker([state.location.lat, state.location.lng]).addTo(map);
            map.on('click', (e) => {
                marker.setLatLng(e.latlng);
                document.getElementById('lat-input').value = e.latlng.lat.toFixed(4);
                document.getElementById('lng-input').value = e.latlng.lng.toFixed(4);
            });
        }

                if (state.weatherError) {
                    astroContent = '<div class="text-center py-10 text-red-400 text-sm font-bold">천체 관측 예보 데이터를 불러오는데 실패했습니다.<br/><span class="text-xs text-gray-500 font-normal">네트워크 오류 또는 프록시 응답 지연</span></div>';
                } else if (state.astroWeather) {
                    astroContent = `
                        <div>
                            <h3 class="text-lg font-bold mb-4 flex items-center gap-2 text-purple-400"><i data-lucide="star"></i> 천체 관측 예보 (7Timer!)</h3>
                            <div class="space-y-3">
                                ${state.astroWeather.map(w => `
                                    <div class="bg-gray-900 p-4 rounded-xl border border-gray-800 flex flex-col sm:flex-row justify-between sm:items-center gap-3 shadow-md">
                                        <div class="font-bold text-purple-300 text-sm sm:w-1/4">시점: +${w.timepoint}시간</div>
                                        <div class="grid grid-cols-3 gap-2 text-center text-sm flex-1">
                                            <div class="bg-gray-950 p-2 rounded-lg border border-gray-800"><div class="text-gray-500 mb-0.5 text-[10px] uppercase">구름</div><div class="font-bold text-base">${w.cloudcover}</div></div>
                                            <div class="bg-gray-950 p-2 rounded-lg border border-gray-800"><div class="text-gray-500 mb-0.5 text-[10px] uppercase">투명도</div><div class="font-bold text-base">${w.transparency}</div></div>
                                            <div class="bg-gray-950 p-2 rounded-lg border border-gray-800"><div class="text-gray-500 mb-0.5 text-[10px] uppercase">시잉</div><div class="font-bold text-base">${w.seeing}</div></div>
                                        </div>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                } else {
                    astroContent = '<div class="text-center py-10 text-gray-500 text-sm">천체 관측 예보를 불러오는 중입니다...</div>';
                }

                app.innerHTML = `
                    <div class="p-4 sm:p-6 pb-24">
                        <h2 class="text-2xl font-bold mb-6 text-white flex items-center gap-2"><i data-lucide="cloud-sun"></i> 관측 기상 예보</h2>
                        ${astroContent}
                    </div>
                `;
            } else if (state.view === 'map') {
                app.innerHTML = `
                    <div class="h-full flex flex-col pt-4 relative z-0">
                        <div class="px-4 pb-4 bg-gray-950 space-y-3 shrink-0">
                            <div class="flex justify-between items-center mb-1">
                                <h2 class="text-lg font-bold flex items-center gap-2"><i data-lucide="map" class="w-5 h-5 text-blue-400"></i> 관측지 설정</h2>
                                <button onclick="getCurrentLocation()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-2 rounded-xl flex items-center gap-1.5 text-sm font-bold transition-colors shadow-[0_0_12px_rgba(79,70,229,0.6)]">
                                    <i data-lucide="navigation" class="w-4 h-4"></i> 현위치 가져오기
                                </button>
                            </div>
                            
                            <div class="flex justify-center items-center gap-2 w-full">
                                <div class="flex items-center gap-1.5 bg-gray-900 px-3 py-2 rounded-xl border border-gray-800 flex-1">
                                    <span class="text-sm font-bold text-gray-400">위도</span>
                                    <input id="lat-input" type="text" value="${state.location.lat.toFixed(4)}" class="w-full bg-gray-800 p-1.5 rounded-lg text-white text-sm outline-none text-center font-mono">
                                </div>
                                <div class="flex items-center gap-1.5 bg-gray-900 px-3 py-2 rounded-xl border border-gray-800 flex-1">
                                    <span class="text-sm font-bold text-gray-400">경도</span>
                                    <input id="lng-input" type="text" value="${state.location.lng.toFixed(4)}" class="w-full bg-gray-800 p-1.5 rounded-lg text-white text-sm outline-none text-center font-mono">
                                </div>
                            </div>
                            
                            <div class="flex gap-2 w-full mt-1">
                                <button onclick="findLocation()" class="flex-1 bg-gray-700 hover:bg-gray-600 py-2.5 rounded-xl text-sm font-bold transition-colors flex items-center justify-center gap-1.5"><i data-lucide="search" class="w-4 h-4"></i>찾기</button>
                                <button onclick="saveToList()" class="flex-1 bg-gray-700 hover:bg-gray-600 py-2.5 rounded-xl text-sm font-bold transition-colors flex items-center justify-center gap-1.5"><i data-lucide="bookmark" class="w-4 h-4"></i>저장</button>
                                <button onclick="confirmLocation()" class="flex-1 bg-blue-600 hover:bg-blue-500 py-2.5 rounded-xl text-sm font-bold transition-colors flex items-center justify-center gap-1.5 shadow-lg"><i data-lucide="check" class="w-4 h-4"></i>설정</button>
                            </div>
                            
                            <div class="mt-4 text-center">
                                <div class="text-[16px] font-bold text-gray-300 mb-3">저장된 위치 (최대 3개)</div>
                                <div class="flex justify-center gap-3 overflow-x-auto scrollbar-hide pb-1">
                                    ${state.savedLocations.map((loc, i) => `
                                        <div class="bg-gray-800 border border-gray-700 px-4 py-2 rounded-full text-base flex items-center gap-2 flex-shrink-0 shadow-md">
                                            <span class="cursor-pointer hover:text-blue-400 font-bold" onclick="moveToSaved(${loc.lat}, ${loc.lng})">${loc.name}</span>
                                            <i data-lucide="x" class="w-4 h-4 cursor-pointer text-gray-500 hover:text-red-400 ml-1" onclick="deleteLocation(${i})"></i>
                                        </div>
                                    `).join('')}
                                    ${state.savedLocations.length === 0 ? '<span class="text-sm text-gray-600">저장된 위치가 없습니다.</span>' : ''}
                                </div>
                            </div>
                        </div>
                        <div id="map-container" class="flex-grow w-full border-t border-gray-800 z-0" style="min-height: 400px;"></div>
                    </div>
                `;
                setTimeout(() => {
                    initMap();
                }, 100);
            }
            
            if(window.lucide) lucide.createIcons();
            updateClocks();
        }

        // --- 초기화 로직 ---
        function initApp() {
            state.date = new Date();
            calculateData(true);
            fetchCurrentWeather(); // 홈 화면 날씨 로드
            setView('home');
            setTimeout(() => {
                syncWheelScrolls();
            }, 100);
        }
        
        window.onload = initApp;
    </script>
</body>
</html>
